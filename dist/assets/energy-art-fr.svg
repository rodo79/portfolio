<svg xmlns="http://www.w3.org/2000/svg" class="energy-scene community-scene" viewBox="0 0 620 510" role="img" aria-labelledby="diagram-title-fr diagram-desc-fr">
      <title id="diagram-title-fr">Deux maisons avec panneaux solaires, une batterie, une voiture électrique et le réseau.</title><desc id="diagram-desc-fr">Deux maisons avec panneaux solaires, une batterie, une voiture électrique et le réseau. De petits points lumineux suivent les liaisons : du solaire vers les usages et le stockage le jour, puis du stockage vers les usages la nuit.</desc>
      <style>svg{background:#1d4135}.scene-stars,.scene-moon,.storage-route,.storage-particles{display:none}.energy-scene text{fill:#f4f0e7;font-family:sans-serif;font-size:15px}.energy-scene .ems-word{font-family:Georgia,serif;font-size:34px}.energy-scene .ems-brand{font-size:8px;letter-spacing:1px}@media(prefers-reduced-motion:reduce){.solar-particles{display:none}}</style><defs>
